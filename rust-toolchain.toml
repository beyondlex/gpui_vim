[toolchain]
# gpui-vim-pre is compiled against gpui-pre 0.3.8, which uses std::hint::cold_path
# (an unstable feature before rustc 1.96): the default stable 1.94.1 cannot even get
# cargo build to pass.
# The same requirement used to be written only in the dev machine's rustup directory
# override, so pin it explicitly here.
channel = "1.96.1"
