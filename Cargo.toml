[workspace]
resolver = "2"
members = ["crates/gpui-vim", "crates/gpui-vim-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
ropey = "1"
unicode-width = "0.2"
# 引擎单一来源：crates.io registry（0.1.24 起与 git main 同步发版）。
# 本地迭代引擎时临时换 path 覆盖（cargo 不会自动偏好本地目录）：
#   [patch.crates-io] vimcore = { path = "../vimcore" }
vimcore = "0.1"

[profile.dev]
opt-level = 1

# gpui 线单一来源：registry 的 gpui-x 发行版（原 fork-gpui-x 分支线已转为
# gpui-vim-x + gpui-x 家族发布，git/patch 依赖全部退役）。
