[workspace]
resolver = "2"
members = ["crates/gpui-vim", "crates/gpui-vim-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
ropey = "1"
unicode-width = "0.2"
# 引擎跟随上游 git main：0.1.4（2026-09-29）之后 crates.io 长期未发版，
# parity/fuzz 修复都只在 git 上；Cargo.lock 锁 rev 保证可复现。
# 本地迭代引擎时临时换 path 覆盖（cargo 不会自动偏好本地目录）：
#   [patch.crates-io] vimcore = { path = "../vimcore" }
vimcore = { git = "https://github.com/beyondlex/vimcore", branch = "main" }

[profile.dev]
opt-level = 1

# 使用优化后的 gpui：独立发行版 gpui-x（不再依赖整个 zed monorepo）。
[patch.crates-io]
gpui = { git = "https://github.com/beyondlex/gpui-x", branch = "main" }
