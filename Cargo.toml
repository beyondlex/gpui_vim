[workspace]
resolver = "2"
members = ["crates/gpui-vim", "crates/gpui-vim-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
ropey = "1"
unicode-width = "0.2"

[profile.dev]
opt-level = 1

# 使用优化后的 gpui：独立发行版 gpui-x（不再依赖整个 zed monorepo）。
# 引擎 vimcore 已发版（0.1.0，2026-09-28），registry 单一来源；本地迭代
# 引擎时临时加回 vimcore = { path = "../vimcore" }。
[patch.crates-io]
gpui = { git = "https://github.com/beyondlex/gpui-x", branch = "main" }
