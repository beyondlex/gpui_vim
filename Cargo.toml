[workspace]
resolver = "2"
members = ["crates/gpui-vim-core", "crates/gpui-vim", "crates/gpui-vim-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
regex = "1"
ropey = "1"
unicode-width = "0.2"

[profile.dev]
opt-level = 1

# 使用优化后的 gpui：独立发行版 gpui-x（不再依赖整个 zed monorepo）
[patch.crates-io]
gpui = { git = "https://github.com/beyondlex/gpui-x", branch = "main" }
