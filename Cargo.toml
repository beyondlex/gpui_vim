[workspace]
resolver = "2"
members = ["crates/gpui-vim-pre", "crates/gpui-vim-pre-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
ropey = "1"
unicode-width = "0.2"
# Single source for the engine: the crates.io registry 0.2 line (followed to
# 0.2.3, 2026-10-26; the migrations: 0.2.0's write primitives return bool,
# 0.2.3's end_undo_group close signal).
# To iterate on the engine locally, temporarily override with a path dependency
# (cargo does not prefer local directories on its own):
#   [patch.crates-io] vimcore = { path = "../vimcore" }
# ⚠️ "0.2" is only the required range; what actually takes effect is Cargo.lock: this
# repo once pinned the lock to 0.1.24, which shielded it from every engine behavior
# change in between. Run cargo update -p vimcore before touching anything related to
# engine semantics.
vimcore = "0.3"

[profile.dev]
opt-level = 1

# Single source for the gpui line: this branch (fork-gpui-pre) uses gpui-pre 0.3.8
# (the same-source snapshot as gpui-kit, zed@279fe07). The previous line was the
# gpui-x releases on the registry (gpui-vim-x, serving pandagit). The two lines
# coexist: different hosts, different crate names (gpui-vim-pre / gpui-vim-x), and
# each can be published on its own.
# gpui-vim-pre 0.1.1 went up on crates.io on 2026-10-09 (tk's Bench consumes exactly
# this package).
# ⚠️ This branch requires rustc ≥ 1.96: gpui-pre 0.3.8 uses std::hint::cold_path,
# which was an unstable feature before 1.96, so the default stable 1.94 cannot even
# get cargo build to pass.
# Already pinned by the rust-toolchain.toml in the repository root (this requirement
# used to live only in the dev machine's rustup override).
# Measured (2026-10-09): the ~22 gpui APIs gpui-vim uses drift zero between the two
# snapshots; switching is a pure dependency change.
