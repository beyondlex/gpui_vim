[workspace]
resolver = "2"
members = ["crates/gpui-vim", "crates/gpui-vim-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
ropey = "1"
unicode-width = "0.2"
# Single source for the engine: the crates.io registry (0.1.24 onwards it is
# released in sync with git main). To iterate on the engine locally, temporarily
# override with a path dependency (cargo does not prefer local directories on
# its own):
#   [patch.crates-io] vimcore = { path = "../vimcore" }
vimcore = "0.5"

[profile.dev]
opt-level = 1

# Single source for the gpui line: the gpui-x releases on the registry (the
# former fork-gpui-x branch line is now published as the gpui-vim-x + gpui-x
# family; all git/patch dependencies are retired).
