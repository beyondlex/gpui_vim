[workspace]
resolver = "2"
members = ["crates/gpui-vim-pre", "crates/gpui-vim-pre-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/gpui_vim"

[workspace.dependencies]
ropey = "1"
unicode-width = "0.2"
# 引擎单一来源：crates.io registry（0.1.24 起与 git main 同步发版）。
# 本地迭代引擎时临时换 path 覆盖（cargo 不会自动偏好本地目录）：
#   [patch.crates-io] vimcore = { path = "../vimcore" }
vimcore = "0.1"

[profile.dev]
opt-level = 1

# gpui 线单一来源：本分支（fork-gpui-pre）走 gpui-pre 0.3.8（gpui-kit 同源快照
# zed@279fe07）。上一条线是 registry 的 gpui-x 发行版（gpui-vim-x，服务 pandagit），
# 两条线并存：宿主不同、crate 名不同（gpui-vim-pre / gpui-vim-x），可各自发布。
# 实测（2026-10-09）：gpui-vim 用到的 ~22 个 gpui API 在两个快照间零漂移，切换纯改依赖。
