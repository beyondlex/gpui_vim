[package]
name = "gpui-vim-pre-demo"
description = "Reference host for vimcore: a minimal multi-line editor with full vim mode."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# 只作参考宿主，不发布（path 依赖无版本号，publish 会失败）
publish = false

[[bin]]
name = "gpui-vim-pre-demo"
path = "src/main.rs"

[dependencies]
vimcore = { workspace = true }
gpui-vim = { path = "../gpui-vim-pre", package = "gpui-vim-pre" }
gpui = { version = "0.3.8", package = "gpui-pre" }
# 应用启动入口 helper（gpui-pre 家族发布为 gpui-pre-platform，lib 名仍是 gpui_platform）。
# font-kit 必须显式开启，否则 gpui_macos 退到 NoopTextSystem（无文字）
gpui_platform = { version = "0.3.8", package = "gpui-pre-platform", features = [
    "font-kit",
] }
ropey = { workspace = true }
