[package]
name = "gpui-vim-pre-demo"
description = "Reference host for vimcore: a minimal multi-line editor with full vim mode."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Reference host only, not published (path deps carry no version, publish would fail)
publish = false

[[bin]]
name = "gpui-vim-pre-demo"
path = "src/main.rs"

[dependencies]
vimcore = { workspace = true }
gpui-vim = { path = "../gpui-vim-pre", package = "gpui-vim-pre" }
gpui = { version = "0.3.8", package = "gpui-pre" }
# App launch-entry helper (published in the gpui-pre family as gpui-pre-platform, the
# lib name is still gpui_platform).
# font-kit must be enabled explicitly, otherwise gpui_macos falls back to
# NoopTextSystem (no text renders)
gpui_platform = { version = "0.3.8", package = "gpui-pre-platform", features = [
    "font-kit",
] }
ropey = { workspace = true }
