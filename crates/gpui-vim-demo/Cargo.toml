[package]
name = "gpui-vim-demo"
description = "Reference host for vimcore: a minimal multi-line editor with full vim mode."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Reference host only, not published (path deps carry no version, publish would fail)
publish = false

[[bin]]
name = "gpui-vim-demo"
path = "src/main.rs"

[dependencies]
vimcore = { workspace = true }
gpui-vim = { path = "../gpui-vim", package = "gpui-vim-x" }
gpui = { version = "0.2", package = "gpui-x" }
# App launch-entry helper (not on crates.io, taken from the same gpui-x source).
# font-kit must be enabled explicitly, otherwise gpui_macos falls back to
# NoopTextSystem (no text renders)
gpui_platform = { version = "0.1", package = "gpui-x-platform", features = [
    "font-kit",
] }
ropey = { workspace = true }
