[package]
name = "gpui-vim-demo"
description = "Reference host for gpui-vim-core: a minimal multi-line editor with full vim mode."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# 只作参考宿主，不发布（path 依赖无版本号，publish 会失败）
publish = false

[[bin]]
name = "gpui-vim-demo"
path = "src/main.rs"

[dependencies]
gpui-vim-core = { path = "../gpui-vim-core" }
gpui-vim = { path = "../gpui-vim" }
gpui = "0.2"
ropey = { workspace = true }
