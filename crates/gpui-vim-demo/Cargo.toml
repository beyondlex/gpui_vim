[package]
name = "gpui-vim-demo"
description = "Reference host for vim-core: a minimal multi-line editor with full vim mode."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# 只作参考宿主，不发布（path 依赖无版本号，publish 会失败）
publish = false

[[bin]]
name = "gpui-vim-demo"
path = "src/main.rs"

[dependencies]
vim-core = { path = "../vim-core" }
gpui-vim = { path = "../gpui-vim" }
gpui = "0.2"
# 应用启动入口 helper（gpui_platform 未发布 crates.io，取自同一 fork 分支）
gpui_platform = { git = "https://github.com/beyondlex/zed", branch = "gpui-path-perf" }
ropey = { workspace = true }
